# THE GATE. Every push and every pull request, on any branch.
#
# Two layers, because that is the rule this project works to: the Elixir suite, and a real browser driving
# the pages. A node suite supplies its own inputs and so tests the app you imagined; the browser tests the
# one that runs. The last three defects in this repo were only visible in the second layer.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0.3"
  MIX_ENV: test

jobs:
  test:
    name: elixir
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nebulith_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      # An unused dependency in the lock file is a dependency nobody decided to keep.
      - run: mix deps.unlock --check-unused

      - run: mix format --check-formatted

      - run: mix compile

      # The port matters: the endpoint starts during tests, and the dev server may hold the default.
      - name: mix test
        run: mix test
        env:
          PORT: "4002"

  browser:
    name: browser
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nebulith_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - run: npm ci --prefix assets

      # THE ASSET BINARIES, CACHED. `assets.setup` downloads tailwind and esbuild from GitHub releases
      # on every run, so a GitHub 5xx fails a build that has nothing wrong with it. It has already done
      # so twice in a row. Keyed on the versions in config/config.exs, and `--if-missing` means a hit
      # skips the download entirely.
      - name: Cache the asset binaries
        uses: actions/cache@v4
        with:
          path: |
            _build/tailwind-*
            _build/esbuild-*
          key: ${{ runner.os }}-assetbins-${{ hashFiles('config/config.exs') }}
          restore-keys: ${{ runner.os }}-assetbins-

      # THE INSTALLER HAS TO BE THE PLAYWRIGHT THE TESTS IMPORT, and this proves it rather than
      # assuming it. Every Playwright version hard-codes the browser revision it will launch, so an
      # installer that is a different build installs one browser and the tests launch another, which
      # surfaces three steps later as "Executable doesn't exist" and says nothing about why.
      #
      # It has gone wrong twice, two different ways. First `npx --prefix assets` resolved nothing
      # locally and fetched playwright from the registry. Then @playwright/test, which nothing
      # imports, shipped a SECOND binary of the same name at a different version and the runner
      # picked that one. The dead package is gone and the version is pinned exactly; the check is
      # here so a third way fails on this line instead of in the gates.
      - name: Install the browser the tests launch
        working-directory: assets
        run: |
          installer=$(./node_modules/.bin/playwright --version)
          imported="Version $(node -p "require('playwright/package.json').version")"
          echo "installer: $installer / imported by the tests: $imported"
          test "$installer" = "$imported"
          ./node_modules/.bin/playwright install --with-deps chromium

      - run: mix assets.setup

      # THE SAME SCRIPT A PERSON RUNS, and the same browser. `bin/e2e` starts a Playwright server in a
      # container and runs the Elixir scenarios against it.
      #
      # A runner could skip the container, because ubuntu-latest can run Playwright's own driver and
      # this machine cannot. It does not, on purpose. A difference between how CI runs something and
      # how a person runs it hides a defect for exactly as long as it exists, which this repo has
      # already paid for twice: once when CI drove an empty dev database while a person's run drove
      # their real work, and once when a whole browser layer was skipped here and nobody noticed that
      # neither of its tests could ever have passed.
      - name: Drive the pages
        run: bin/e2e

      # THE NODE GATES, while they are still being ported to Elixir. They have their own database
      # because they drive a separately booted server rather than the test endpoint.
      - name: The gates not yet ported
        run: bin/e2e-node
        env:
          E2E_DATABASE_URL: ecto://postgres:postgres@localhost/nebulith_e2e
