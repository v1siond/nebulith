# STAGING DEPLOYS ON A PUSH TO `staging`.
#
# Same shape as retrogroove: Railway builds the repo's own Dockerfile, the release runs `bin/server`, and
# migrations run before the new version takes traffic. The only difference is which service it lands on.
#
# Production is NOT here on purpose. It deploys from a tag, never from a branch.
name: deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# One deploy at a time, and let a running one finish: cancelling half way through leaves the service in a
# state nobody chose.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: railway
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Install the Railway CLI
        run: npm install -g @railway/cli

      # ONE TOKEN PER ENVIRONMENT. A Railway PROJECT token is scoped to a single environment, so a
      # shared secret cannot address both, and `--environment` is stated as well so the target is
      # readable here rather than implied by whichever token happens to be in the secret.
      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --environment "staging" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_STAGING }}
